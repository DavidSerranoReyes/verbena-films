name: 🌐 Publicar la web en CDmon

# Reconstruye el sitio Astro con el contenido del CMS (Strapi) y lo sube por FTP
# a CDmon. Objetivo: que la dueña publique en el panel y la web se actualice
# sola, sin que nadie tenga que ejecutar `npm run build` ni subir archivos a mano.
#
# Cómo se comporta:
#   1. Compara la huella del contenido del CMS y el commit del repo con los de la
#      web ya publicada (https://www.verbenafilms.com/version.json).
#   2. Si no hay nada nuevo, termina sin tocar Strapi ni el FTP.
#   3. Si hay algo nuevo: despierta Strapi, construye y sube SOLO lo que cambió.
#
# Se ejecuta cada 20 minutos a propósito: si fuera cada 10, Strapi (plan Free de
# Render) no llegaría a dormirse nunca y consumiría sus 750 horas mensuales.

on:
  # Strapi avisa a GitHub en cuanto se publica algo en el panel (es el disparador
  # principal, porque el programado de GitHub es poco fiable).
  repository_dispatch:
    types: [strapi-publish]
  schedule:
    # Red de seguridad cada 20 minutos, pero a los minutos 5/25/45 y no a en
    # punto: GitHub avisa de que las tareas "al inicio de la hora" son las que
    # más se retrasan o se descartan por carga.
    - cron: '5,25,45 * * * *'
  # Si se cambia el código, se publica enseguida (sin esperar al turno siguiente).
  # Los cambios de solo documentación no necesitan publicar la web.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular: muestra qué subiría, sin tocar el servidor'
        type: boolean
        default: false

# Evita que dos publicaciones se pisen entre sí
concurrency:
  group: publicar-cdmon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Construir y subir
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Comprobar que están los secretos FTP
        id: secretos
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_PASSWORD" ]; then
            echo "listos=1" >> "$GITHUB_OUTPUT"
          else
            echo "listos=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secretos FTP. Añádelos en Settings → Secrets and variables → Actions (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)."
          fi

      - name: ¿Hay algo nuevo que publicar?
        id: cambios
        if: steps.secretos.outputs.listos == '1'
        run: |
          CMS="https://verbena-films-strapi.onrender.com"
          # Misma fórmula que src/pages/version.json.ts: sha256(films + "\n" + articles)
          NUEVA=$( { curl -s -m 90 "$CMS/api/films?populate=*"; printf '\n'; curl -s -m 90 "$CMS/api/articles?populate=*"; } | sha256sum | cut -c1-20 )
          # Con reintentos y un user-agent "normal": CDmon a veces bloquea
          # peticiones sin navegador (curl) y devolvía vacío.
          VIVA=$(curl -s -m 30 --retry 3 --retry-delay 3 -A "Mozilla/5.0 (compatible; VerbenaDeploy/1.0)" https://www.verbenafilms.com/version.json || true)
          HUELLA_VIVA=$(printf '%s' "$VIVA" | sed -n 's/.*"huella": *"\([^"]*\)".*/\1/p')
          COMMIT_VIVO=$(printf '%s' "$VIVA" | sed -n 's/.*"commit": *"\([^"]*\)".*/\1/p')
          echo "Huella del CMS ahora : $NUEVA"
          echo "Huella publicada     : ${HUELLA_VIVA:-ninguna}"
          echo "Commit publicado     : ${COMMIT_VIVO:-ninguno}"
          echo "Commit de este repo  : $GITHUB_SHA"
          if [ "$NUEVA" = "$HUELLA_VIVA" ] && [ "$GITHUB_SHA" = "$COMMIT_VIVO" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "publicar=0" >> "$GITHUB_OUTPUT"
            echo "::notice::La web ya está al día: no hace falta publicar nada."
          else
            echo "publicar=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar el código
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1'
        uses: actions/checkout@v4

      - name: Preparar Node
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Despertar Strapi (el plan Free de Render se duerme)
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1'
        run: |
          URL="https://verbena-films-strapi.onrender.com/_health"
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$URL" || true)
            echo "Intento $i → HTTP $CODE"
            if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
              echo "Strapi despierto ✅"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Strapi no respondió a tiempo. La web se construirá con los datos estáticos: no se rompe nada, pero puede no incluir lo último publicado."

      - name: Instalar dependencias
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1'
        run: npm install --no-audit --no-fund

      - name: Construir la web con el contenido del CMS
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1'
        env:
          PUBLIC_USE_STRAPI: 'true'
          PUBLIC_STRAPI_URL: 'https://verbena-films-strapi.onrender.com'
          # Margen para que Strapi despierte sin abortar la petición
          PUBLIC_STRAPI_TIMEOUT: '90000'
        run: npm run build

      - name: ¿Respondió el CMS durante el build?
        id: cms
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1'
        run: |
          HUELLA=$(sed -n 's/.*"huella": *"\([^"]*\)".*/\1/p' dist/version.json | head -1)
          echo "Huella construida: ${HUELLA:-ninguna}"
          if [ "$HUELLA" = "error" ] || [ -z "$HUELLA" ]; then
            echo "seguir=0" >> "$GITHUB_OUTPUT"
            echo "::warning::El CMS no respondió al construir la web. NO se publica, para no dejar la web sin el contenido que hay en Strapi. Se reintentará en el siguiente turno."
          else
            echo "seguir=1" >> "$GITHUB_OUTPUT"
          fi

      # CDmon a veces corta la conexión (ECONNRESET) o ni responde al conectar,
      # así que se reintenta hasta 3 veces con una espera entre intentos.
      - name: Subir a CDmon (con reintentos)
        if: steps.secretos.outputs.listos == '1' && steps.cambios.outputs.publicar == '1' && steps.cms.outputs.seguir == '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          for intento in 1 2 3; do
            echo "::group::Intento $intento de 3"
            if npx --yes @samkirkland/ftp-deploy \
                 --server "$FTP_SERVER" \
                 --username "$FTP_USERNAME" \
                 --password "$FTP_PASSWORD" \
                 --port 21 \
                 --local-dir ./dist/ \
                 --server-dir /web/ \
                 --dry-run "$DRY_RUN" \
                 --log-level standard \
                 --exclude "**/.git*" --exclude "**/.git*/**" --exclude "**/.DS_Store"; then
              echo "::endgroup::"
              echo "✅ Web publicada correctamente (intento $intento)."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$intento" -lt 3 ]; then
              echo "::warning::El intento $intento falló. Espero 30 s y reintento…"
              sleep 30
            fi
          done
          echo "::error::No se pudo subir la web a CDmon tras 3 intentos. La versión anterior sigue publicada: no se ha roto nada."
          exit 1
